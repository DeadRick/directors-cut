<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Layout: one-column mobile app (max 560px): marquee header, scrolling screen, fixed bottom nav or wizard bar.
   Look: an 8-bit picture palace. Everything is built from the same pieces as the pixel art:
   hard 2px edges, stepped corners, hard drop shadows, one palette (the PX colours), one pixel display face. */
:root {
  --ink: #140a0c;
  --velvet: #1d0c12;
  --velvet-2: #240f17;
  --panel: #2c141c;
  --panel-2: #3a1b25;
  --edge: #5e2f3c;
  --edge-hi: #7a4050;
  --cream: #f4e7d2;
  --cream-dk: #d9c6a8;
  --muted: #b39488;
  --bulb: #f2b441;
  --bulb-dk: #a8701e;
  --red: #d0412e;
  --good: #8fcf8f;
  --bad: #ec7a68;
  --sky: #8fd8f0;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --mono: var(--display);
  --digits: "Pixelify Sans", "Courier New", monospace;
  /* stepped corner: the pixel-art version of a rounded corner */
  --notch: polygon(0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
    100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
    4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px));
  color-scheme: dark;
}
/* Pixelify's Cyrillic glyphs read oddly (Y-shaped У, hooked К), so Russian uses Tiny5. */
html[lang="ru"] { --display: "Tiny5", "Pixelify Sans", "Courier New", monospace; --digits: var(--display); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--velvet); color: var(--cream);
  font: 15px/1.45 var(--body);
  /* a 2px dither, like the backdrops in the pixel scenes */
  background-image: conic-gradient(var(--velvet-2) 25%, transparent 0 50%, var(--velvet-2) 0 75%, transparent 0);
  background-size: 4px 4px;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--bulb); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 116px; min-height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 24px; text-transform: uppercase; color: var(--cream); text-shadow: 2px 2px 0 var(--ink); }
/* section label: amber pixel caps with a dotted rule running to the edge */
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; color: var(--bulb); font-weight: 500; display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
h3::after { content: ""; flex: 1; height: 2px; min-width: 0; background: repeating-linear-gradient(90deg, var(--edge) 0 2px, transparent 2px 4px); }
.row > h3, .card > .row > h3 { flex: 1; }
.mono, .num { font-family: var(--digits); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.caps { text-transform: uppercase; letter-spacing: .08em; }
.pixel { font-family: var(--display); }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.ico { width: 14px; height: 14px; vertical-align: -2px; image-rendering: pixelated; flex: none; }
.ico.lg { width: 24px; height: 24px; }

/* Panels: flat fill, 2px inner edge, stepped corners, hard shadow underneath */
.card, .opt, .scorebox, .marquee, .ticket, .toast, .reallink, .stat, input[type=text], .btn, .pill, .chip, .note, .langbtn, .pm button, .tag, .scene, .lot {
  clip-path: var(--notch); border-radius: 0;
}
.card { background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), inset 0 -4px 0 rgba(0,0,0,.25); padding: 14px; border: 0; }

/* Marquee header: the one bold element, with chasing bulbs */
.marquee { position: relative; padding: 16px 16px 14px; background: var(--red); background: #4a1822; box-shadow: inset 0 0 0 2px #7a2a38, inset 0 0 0 4px var(--ink); }
.marquee::before, .marquee::after {
  content: ""; position: absolute; left: 8px; right: 8px; height: 4px; pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--bulb) 0 4px, transparent 4px 12px);
  animation: chase .9s steps(3) infinite;
}
.marquee::before { top: 6px; } .marquee::after { bottom: 6px; animation-direction: reverse; }
@keyframes chase { to { background-position: 12px 0; } }
.marquee .studio { font-family: var(--display); font-size: 28px; font-weight: 700; text-transform: uppercase; line-height: 1.05; color: var(--bulb); text-shadow: 2px 2px 0 var(--ink); padding-top: 6px; }
.marquee .sub { font-size: 13px; color: var(--cream-dk); font-family: var(--display); letter-spacing: .04em; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.stat { background: var(--ink); padding: 6px 8px; min-width: 0; }
.stat b { display: block; font-family: var(--digits); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); }
.stat span { font-family: var(--display); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat.bump b { animation: bump .5s steps(3); }
@keyframes bump { 30% { color: var(--bulb); transform: translateY(-2px); } }
.langbtn { background: var(--ink); color: var(--cream-dk); border: 0; padding: 3px 8px; font-size: 12px; font-family: var(--display); }

/* Ticket stock: cream card with punched pixel holes */
.ticket { position: relative; background: var(--cream); color: #2a1218; padding: 14px 18px; box-shadow: inset 0 -4px 0 var(--cream-dk); }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 8px; height: 12px; margin-top: -6px; background: var(--velvet); }
.ticket::before { left: 0; } .ticket::after { right: 0; }
.ticket .muted { color: #6e4a48; }
.ticket h3 { color: #7a1f24; } .ticket h3::after { background: repeating-linear-gradient(90deg, var(--cream-dk) 0 2px, transparent 2px 4px); }

/* Buttons: a raised block with a darker lip that presses down */
.btn { border: 0; padding: 12px 16px 14px; font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  background: var(--panel-2); color: var(--cream); box-shadow: inset 0 0 0 2px var(--edge-hi), inset 0 -4px 0 var(--ink); transition: transform .06s steps(1); }
.btn.primary { background: var(--bulb); color: var(--ink); box-shadow: inset 0 0 0 2px #ffd36a, inset 0 -4px 0 var(--bulb-dk); }
.btn.primary:not(:disabled):hover { background: #f7c35a; }
.btn.big { width: 100%; padding: 16px 16px 18px; font-size: 21px; }
.btn.big.primary { animation: glint 4s steps(1) infinite; background-image: linear-gradient(100deg, transparent 0 40%, rgba(255,255,255,.35) 40% 46%, transparent 46%); background-size: 300% 100%; background-repeat: no-repeat; }
@keyframes glint { 0%, 70% { background-position: 150% 0; } 75% { background-position: 100% 0; } 80% { background-position: 50% 0; } 85%, 100% { background-position: -50% 0; } }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 12px 8px; font-size: 14px; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--edge-hi), inset 0 -2px 0 var(--ink); }
.btn.primary:active:not(:disabled) { box-shadow: inset 0 0 0 2px #ffd36a, inset 0 -2px 0 var(--bulb-dk); }
.btn.dark { background: var(--ink); color: var(--cream); box-shadow: inset 0 0 0 2px #3a1f28, inset 0 -4px 0 #000; }

/* Choice tiles */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.opt { position: relative; text-align: left; background: var(--panel); border: 0; box-shadow: inset 0 0 0 2px var(--edge), inset 0 -4px 0 rgba(0,0,0,.3); padding: 10px 12px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px;
  transition: transform .08s steps(2); }
.opt:not(.locked):hover { transform: translateY(-2px); box-shadow: inset 0 0 0 2px var(--edge-hi), inset 0 -4px 0 rgba(0,0,0,.3); }
.opt .t { font-family: var(--display); font-size: 17px; font-weight: 500; text-transform: uppercase; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.opt .d { font-size: 12px; color: var(--muted); }
.opt.sel { background: #4a2418; box-shadow: inset 0 0 0 2px var(--bulb), inset 0 -4px 0 var(--bulb-dk); }
.opt.sel::after { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; background: var(--bulb); box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite; }
.opt.locked { background: var(--velvet-2); box-shadow: inset 0 0 0 2px #3a1d26; cursor: not-allowed; }
.opt.locked .t, .opt.locked .gicon, .opt.locked .avatar { opacity: .45; }
.opt.locked .d { color: #a7685c; }
.opt .tag { position: absolute; top: 8px; right: 8px; font-size: 11px; font-family: var(--display); padding: 2px 6px; background: var(--ink); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 4px; align-items: center; }
.opt.sel .tag { right: 18px; }
.tag.hot { color: var(--bulb); }
.swatch { width: 100%; height: 4px; margin-bottom: 6px; }
.opt.person { flex-direction: row; gap: 10px; align-items: center; text-align: left; }
.avatar { flex: none; width: 40px; height: 40px; display: block; box-shadow: 0 0 0 2px var(--ink); }
.person .info { min-width: 0; flex: 1; }
.person .name { font-weight: 600; font-size: 15px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bars { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.bars b { color: var(--cream); font-family: var(--display); font-weight: 500; }
.fee { font-family: var(--digits); font-size: 14px; color: var(--bulb); white-space: nowrap; }
.opt.rel { flex-direction: column; align-items: flex-start; text-align: left; }
.opt .gicon { width: 36px; height: 36px; margin-bottom: 4px; }
.opt .lockico { position: absolute; top: 10px; right: 10px; width: 14px; height: 14px; opacity: .8; }

/* Wizard step track: film frames */
.steps { display: flex; gap: 4px; margin-block: 4px 12px; }
.steps i { flex: 1; height: 8px; background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--edge); }
.steps i.on { background: var(--bulb); box-shadow: inset 0 0 0 2px #ffd36a, inset 0 -2px 0 var(--bulb-dk); }

.focusrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding-block: 8px; border-bottom: 2px dotted var(--edge); }
.focusrow:last-child { border-bottom: 0; }
.focusrow > span { display: flex; align-items: center; gap: 6px; }
.pips { display: flex; gap: 3px; grid-column: 1 / -1; }
.pips i { flex: 1; height: 10px; background: var(--ink); box-shadow: inset 0 0 0 2px var(--edge); }
.pips i.on { background: var(--bulb); box-shadow: inset 0 -2px 0 var(--bulb-dk); }
.pips.mini { display: inline-flex; width: 60px; vertical-align: middle; }
.pips.mini i { height: 6px; box-shadow: inset 0 0 0 1px var(--edge); }
.pm { display: flex; gap: 6px; }
.pm button { width: 38px; height: 34px; background: var(--panel-2); border: 0; box-shadow: inset 0 0 0 2px var(--edge-hi), inset 0 -3px 0 var(--ink); font-size: 18px; font-family: var(--display); }
.pm button:active { transform: translateY(2px); }

/* Bottom bars */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--ink); box-shadow: 0 -2px 0 var(--edge), 0 -4px 0 var(--ink); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bottombar .inner { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
.nav button { position: relative; background: none; border: 0; padding: 6px 2px 8px; font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.nav button .nico { width: 24px; height: 24px; image-rendering: pixelated; opacity: .6; }
.nav button.on { color: var(--bulb); }
.nav button.on .nico { opacity: 1; animation: hop .4s steps(2); }
.nav button.on::after { content: ""; position: absolute; left: 25%; right: 25%; bottom: 0; height: 2px; background: var(--bulb); }
.nav .badge { position: absolute; top: 4px; right: 22%; width: 6px; height: 6px; background: var(--bulb); box-shadow: 0 0 0 2px var(--ink); animation: blink 1s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-3px); } }

/* Posters */
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: #fff; box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 var(--ink); background-size: cover; background-position: center; }
.poster .pt { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1; font-size: 15px; text-shadow: 2px 2px 0 #000; overflow-wrap: anywhere; }
.poster .py { font-family: var(--display); font-size: 10px; opacity: .85; margin-top: 4px; text-shadow: 1px 1px 0 #000; }
.poster .ps { position: absolute; top: 6px; right: 6px; font-family: var(--display); font-size: 13px; font-weight: 600; padding: 2px 6px; background: var(--ink); }
.poster.top { justify-content: flex-start; }
.poster.top .ps { top: auto; bottom: 6px; }
.filmrow { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: start; }
.filmrow .poster .pt { font-size: 11px; }
.filmrow .ftitle { font-family: var(--display); font-size: 18px; text-transform: uppercase; font-weight: 600; line-height: 1.1; }

.score { font-family: var(--digits); font-size: 56px; font-weight: 700; line-height: 1; text-shadow: 3px 3px 0 var(--ink); }
.score.wait { color: var(--edge-hi); animation: blink .8s steps(2) infinite; }
.scorebox { flex: 1; text-align: center; padding: 12px 6px 14px; background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge), inset 0 -4px 0 rgba(0,0,0,.3); min-width: 0; }
.scorebox span { display: block; font-family: var(--display); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 4px; }
.hi { color: var(--good); } .mid { color: var(--bulb); } .lo { color: var(--bad); }

.linechart { width: 100%; height: auto; display: block; margin-top: 8px; shape-rendering: crispEdges; }
.linechart .grid { stroke: var(--edge); stroke-dasharray: 2 2; }
.linechart .area { fill: rgba(242,180,65,.16); }
.linechart .ln { fill: none; stroke: var(--bulb); stroke-width: 2; stroke-linejoin: miter; }
.linechart .dot { fill: var(--bulb); stroke: var(--ink); stroke-width: 1; }
.linechart .dot.last { fill: var(--cream); animation: blink .6s steps(2) infinite; }
.linechart .lbl { fill: var(--muted); font: 10px var(--display); }

.ledger { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.ledger .v { font-family: var(--digits); text-align: right; }
.ledger .total { border-top: 2px dotted var(--edge); padding-top: 6px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 12px; padding: 2px 8px; background: var(--ink); color: var(--cream-dk); letter-spacing: .04em; }
.pill.on { color: var(--bulb); box-shadow: inset 0 0 0 2px var(--bulb-dk); }
.pill.good { color: var(--good); }

.xpbar { height: 8px; background: var(--ink); box-shadow: inset 0 0 0 2px var(--edge); margin-top: 4px; padding: 2px; }

.progress i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--bulb) 0 6px, var(--bulb-dk) 6px 8px); transition: width .2s steps(4); }

@keyframes drop { from { transform: translate(-50%, -16px); } }
input[type=text] { width: 100%; background: var(--ink); border: 0; box-shadow: inset 0 0 0 2px var(--edge); color: var(--cream); padding: 10px 12px; font: 16px var(--body); }
input[type=text]:focus { box-shadow: inset 0 0 0 2px var(--bulb); outline: none; }
.trophy { font-family: var(--display); color: var(--bulb); display: flex; gap: 6px; align-items: center; }

.discover { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.discover li { position: relative; padding-left: 16px; }
.discover li::before { content: ""; position: absolute; left: 0; top: .5em; width: 6px; height: 6px; background: var(--edge-hi); }
.discover li.hi::before { background: var(--good); } .discover li.lo::before { background: var(--bad); }
.discover li.hi { color: var(--good); } .discover li.lo { color: var(--bad); }
.notes { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.note { font-size: 12px; padding: 2px 6px 3px; background: var(--ink); display: inline-flex; align-items: center; gap: 4px; }
.note.hi { color: var(--good); } .note.lo { color: var(--bad); } .note.muted { color: var(--muted); }
.row.mine { background: #4a2418; color: var(--bulb); box-shadow: inset 2px 0 0 var(--bulb); }
.chartrow { padding: 4px 6px; font-size: 14px; }
.reallink { display: flex; gap: 10px; align-items: center; color: var(--cream); text-decoration: none; padding: 8px 10px; background: var(--ink); }

.reallink .rposter img { display: block; width: 36px; height: 54px; object-fit: cover; box-shadow: 0 0 0 2px var(--edge); }
.pill.tm { color: var(--bulb); font-size: 11px; }
.tmdb-note { font-size: 10px; color: var(--muted); margin-top: 6px; }
.chip { font-size: 11px; font-family: var(--display); color: var(--muted); text-decoration: none; padding: 2px 6px 3px; white-space: nowrap; background: var(--panel-2); display: inline-flex; gap: 4px; align-items: center; }
.chip:hover, .chip:focus-visible { color: var(--ink); background: var(--bulb); }
.chip .ico { width: 8px; height: 8px; vertical-align: 0; }
.mark { display: inline-flex; gap: 1px; align-items: center; }
.mark .ico { width: 10px; height: 10px; }

.card.danger { box-shadow: inset 0 0 0 2px var(--bad), inset 0 -4px 0 rgba(0,0,0,.25); }
.card.danger h3 { color: var(--bad); }
.scene { width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 2px var(--edge); background: #1a0c10; padding: 2px; }
.lot { width: 100%; height: auto; aspect-ratio: 3 / 1; display: block; margin-top: 12px; background: var(--ink); padding: 2px; }
.newsflash { display: flex; gap: 12px; align-items: flex-start; }

/* Motion */
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; z-index: 30; }
.shake { animation: shake .18s steps(2) infinite; }
@keyframes shake { 0% { transform: translate(1px, -1px); } 50% { transform: translate(-2px, 1px); } 100% { transform: translate(1px, 1px); } }
@keyframes blink { 50% { opacity: .35; } }
#app.enter { animation: enter .28s steps(4) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.enter .poster { animation: develop .6s steps(6) both; }

.enter .stack > :nth-child(2) { animation-delay: .04s; } .enter .stack > :nth-child(3) { animation-delay: .08s; } .enter .stack > :nth-child(4) { animation-delay: .12s; } .enter .stack > :nth-child(5) { animation-delay: .16s; }

  .progress i { transition: none; }
}

<script>
(() => {
'use strict';

/* ---------- Telegram ---------- */

function load() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) return Object.assign(newGame(), JSON.parse(s)); } catch (e) {}
  return null;
}
function save() {
  const json = JSON.stringify(G);
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  try {
    if (inTG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9')) {
      // CloudStorage values are capped at 4096 chars: store the save in chunks.
      const parts = json.match(/[\s\S]{1,4000}/g) || [];
      TG.CloudStorage.setItem('dc_n', String(parts.length));
      parts.forEach((p, i) => TG.CloudStorage.setItem('dc_' + i, p));
    }
  } catch (e) {}
}
function loadCloud(done) {
  try {
    if (!(inTG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9'))) return done();
    TG.CloudStorage.getItem('dc_n', (err, n) => {
      n = +n; if (err || !n) return done();
      const keys = Array.from({ length: n }, (_, i) => 'dc_' + i);
      TG.CloudStorage.getItems(keys, (err2, vals) => {
        try {
          if (!err2 && vals) {
            const cloud = JSON.parse(keys.map(k => vals[k] || '').join(''));
            if (cloud && (cloud.films || []).length > G.films.length) { G = Object.assign(newGame(), cloud); screen = G.started ? 'home' : 'onboard'; }

    });

}

      x.fillStyle = acc; for (let y = 24; y < H; y++) { const half = Math.round((y - 24) * .55); x.fillRect(16 - half, y, 1, 1); x.fillRect(16 + half, y, 1, 1); if (y % 4 < 2) x.fillRect(16, y, 1, 1); }
      P(15, 33, 2, 6, top); P(15, 31, 2, 2, top); P(14, 39, 1, 2, top); P(17, 39, 1, 2, top);
      x.globalAlpha = .5; for (let i = 0; i < 9; i++) P(18 + i, 41 + Math.floor(i / 3), 1, 1, top); x.globalAlpha = 1;
      break;
    }
    case 5: { // halftone: a giant moon of dots over the skyline
      P(0, 0, W, H, sil);
      for (let j = 0; j < 40; j += 2) for (let i = 0; i < W; i += 2) { const d = Math.hypot(i - 16, j - 16); if (d < 15 && R() < 1.05 - d / 15) P(i + (j % 4 ? 1 : 0), j, 1, 1, acc); }
      drawSkyline(x, R, f.era, W, 40, '#1a0c10', bottom);
      P(0, 40, W, H - 40, '#1a0c10');
      break;
    }
    case 6: { // ensemble: three silhouettes against stripes
      for (let i = 0; i < W; i += 4) P(i, 0, 2, H, bottom);
      P(0, 0, W, H, 'rgba(0,0,0,.25)'); ditherSky(x, W, 14, top, bottom, 3);
      disc(x, 16, 9, 6, acc);
      figure(16, 22, sil, acc, 1); figure(6, 28, '#1a0c10', null, 1); figure(26, 28, '#1a0c10', null, 1);
      break;
    }
    default: { // classic: dithered sky, moon, era skyline, the lead with a rim light
      ditherSky(x, W, H, top, bottom, 5);
      if (['horror', 'scifi', 'fantasy', 'thriller', 'drama'].includes(f.genre)) for (let i = 0; i < 14; i++) P(Math.floor(R() * W), Math.floor(R() * 26), 1, 1, acc);
      const mx = 6 + Math.floor(R() * 20), my = 6 + Math.floor(R() * 10);
      disc(x, mx, my, 3 + Math.floor(R() * 4), acc);
      drawSkyline(x, R, f.era, W, 40, sil, acc);
      P(0, 40, W, H - 40, sil);
      const cx = 16 + (R() < .5 ? -2 : 2);
      figure(cx, 22, sil, acc, mx < cx ? -1 : 1);
      if (R() < .6) { const sx = cx + (R() < .5 ? -12 : 9); P(sx, 31, 3, 3, sil); P(sx - 1, 34, 5, H - 34, sil); }
    }
  }
  // frames
  if (st.frame === 1) { x.strokeStyle = acc; x.lineWidth = 1; x.strokeRect(1.5, 1.5, W - 3, H - 3); }
  if (st.frame === 2) { for (let y = 1; y < H; y += 3) { P(0, y, 2, 2, '#000'); P(W - 2, y, 2, 2, '#000'); } }
  if (st.frame === 3) { P(0, 0, W, 2, acc); P(0, H - 2, W, 2, acc); }
  return (pxCache[key] = c.toDataURL());
}

function drawEffect(x, anim, t, W, H) {
  const P = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(Math.round(a), Math.round(b), w, h); };
  const R = rng(anim + Math.floor(t / 3));
  switch (anim) {
    case 'storm':
      P(0, 0, W, H, 'rgba(10,10,30,.45)');
      for (let i = 0; i < 26; i++) { const rx = (i * 7 + t * 3) % (W + 10) - 5, ry = (i * 13 + t * 5) % H; P(rx, ry, 1, 3, '#8fd8f0'); }
      if (t % 11 < 2) { P(0, 0, W, H, 'rgba(255,255,255,.55)'); drawRows(x, MINI.bolt, 34, 2, 3); }
      break;
    case 'cat': drawRows(x, MINI.cat, (t * 2) % (W + 12) - 6, 26 + (t % 2)); break;
    case 'dog': drawRows(x, MINI.dog, W - (t * 3) % (W + 14), 26 + (t % 2)); break;
    case 'meteor': {
      const k = t % 18;
      if (k < 9) { const mx = 60 - k * 5, my = k * 3; P(mx, my, 3, 3, '#f2b441'); for (let i = 1; i < 6; i++) P(mx + i * 2, my - i, 2, 1, i < 3 ? '#d68a2e' : '#7a1f24'); }
      else { const r = (k - 9) * 3; disc(x, 18, 30, Math.min(r, 14), k % 2 ? '#f2b441' : '#d0412e'); if (k < 12) P(0, 0, W, H, 'rgba(255,240,200,.5)'); }
      break;
    }
    case 'explosion': {
      const k = t % 14, r = k * 2;
      if (k < 8) { disc(x, 24, 22, r, '#d0412e'); disc(x, 24, 22, Math.max(0, r - 3), '#f2b441'); disc(x, 24, 22, Math.max(0, r - 6), '#fff3c4'); }
      else for (let i = 0; i < 10; i++) P(18 + R() * 14, 22 - (k - 8) * 2 - R() * 6, 3, 2, 'rgba(90,90,100,.7)');
      break;
    }
    case 'eclipse': { const k = Math.min(10, t % 24); P(0, 0, W, H, `rgba(0,0,10,${k * .05})`); disc(x, 48, 10, 6, '#ffd36a'); disc(x, 38 + k, 10, 6, '#140a0c'); break; }
    case 'ghost': { x.globalAlpha = .75; drawRows(x, MINI.ghost, 20 + Math.sin(t / 3) * 14, 6 + Math.sin(t / 2) * 3, 2); x.globalAlpha = 1; if (t % 7 === 0) P(0, 0, W, H, 'rgba(120,255,180,.12)'); break; }
    case 'hearts': for (let i = 0; i < 6; i++) drawRows(x, MINI.heart, 40 + ((i * 7) % 18) + Math.sin(t / 2 + i) * 2, 22 - ((t * 2 + i * 6) % 22)); break;
    case 'fight': {
      drawRows(x, MINI.bolt, 46 + (t % 2), 6, 2);
      if (t % 4 < 2) { P(44, 8, 2, 2, '#d0412e'); P(54, 6, 2, 2, '#d0412e'); }
      for (let i = 0; i < 4; i++) P(42 + R() * 18, 8 + R() * 6, 1, 1, '#f4e7d2');
      break;
    }
    case 'money': for (let i = 0; i < 12; i++) drawRows(x, MINI.coin, (i * 11 + 3) % W, ((t * 3 + i * 9) % (H + 6)) - 6); break;
    case 'glitch':
      for (let i = 0; i < 6; i++) { const gy = Math.floor(R() * H), gh = 1 + Math.floor(R() * 3); x.drawImage(x.canvas, 0, gy, W, gh, Math.round(R() * 8 - 4), gy, W, gh); }
      for (let i = 0; i < 5; i++) P(R() * W, R() * H, 4 + R() * 6, 1, rpick(R, ['#d0412e', '#8fd8f0', '#3d9a6c']));
      break;
    case 'reel': drawRows(x, MINI.reel, (t * 3) % (W + 10) - 5, 26 - Math.abs(Math.sin(t / 2)) * 3); P(0, 30, ((t * 3) % (W + 10)) - 3, 1, '#2a1a14'); break;
    case 'strike': for (let i = 0; i < 3; i++) drawRows(x, MINI.sign, 8 + i * 18, 20 + ((t + i) % 2) * 2, 1); break;
    case 'flash': if (t % 3 === 0) { P(0, 0, W, H, 'rgba(255,255,255,.35)'); } for (let i = 0; i < 3; i++) if ((t + i) % 4 === 0) disc(x, 8 + i * 22, 6 + (i % 2) * 6, 3, '#ffffff'); break;
    case 'star': drawRows(x, MINI.star, 42 + Math.sin(t / 2) * 6, 4 + Math.abs(Math.sin(t / 3)) * 3, 2); for (let i = 0; i < 5; i++) if ((t + i) % 3 === 0) P(36 + i * 5, 2 + (i * 7) % 10, 1, 1, '#fff3c4'); break;
    case 'notes': for (let i = 0; i < 5; i++) drawRows(x, MINI.note, 34 + i * 6 + Math.sin(t / 2 + i) * 2, 24 - ((t * 2 + i * 5) % 24)); break;
    case 'zzz': for (let i = 0; i < 3; i++) drawRows(x, MINI.z, 44 + i * 4, 12 - ((t + i * 4) % 12), 1); P(0, 0, W, H, 'rgba(0,0,20,.25)'); break;
    case 'scissors': { const sx = (t * 2) % (W + 6) - 3; P(0, 18, W, 3, '#2a2a33'); for (let i = 0; i < W; i += 3) P(i, 19, 1, 1, '#f4e7d2'); P(sx - 1, 17, 2, 5, '#1a0c10'); drawRows(x, MINI.scis, sx, 12 + (t % 2), 1); break; }
    case 'question': for (let i = 0; i < 4; i++) drawRows(x, MINI.q, 36 + i * 7, 6 + Math.sin(t / 2 + i * 1.5) * 3, 2); break;
    case 'speech': for (let i = 0; i < 2; i++) if ((t + i * 3) % 6 < 4) drawRows(x, MINI.bubble, 36 + i * 12, 6 + (t % 2), 2); break;
    case 'cross': if (t % 4 < 2) { P(0, 0, W, H, 'rgba(208,65,46,.18)'); } drawRows(x, MINI.cross, 26, 4, 3); break;
    case 'dream': for (let i = 0; i < 14; i++) { const a = t / 4 + i * .45, r = 6 + (i % 4) * 4; P(48 + Math.cos(a) * r, 14 + Math.sin(a) * r * .6, 1, 1, i % 3 ? '#d0c0ff' : '#ffd36a'); } P(0, 0, W, H, 'rgba(60,40,120,.18)'); break;
    case 'aura': for (let k = 0; k < 3; k++) { const r = 4 + ((t + k * 3) % 9); x.strokeStyle = `rgba(200,160,255,${.7 - r / 15})`; x.beginPath(); x.arc(44, 20, r, 0, Math.PI * 2); x.stroke(); } break;
  }
}

// Box office as a line chart: weekly takings with an area fill, drawn point by point.
function lineChartSVG(weeks, n) {
  const Wd = 300, Ht = 130, pl = 6, pr = 6, pt = 14, pb = 18, max = Math.max(...weeks) || 1;
  const X = i => pl + i * (Wd - pl - pr) / (weeks.length - 1), Y = v => pt + (1 - v / max) * (Ht - pt - pb);
  const pts = weeks.slice(0, n).map((v, i) => [X(i), Y(v)]);
  const grid = [0, .5, 1].map(k => `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(max * k)}" y2="${Y(max * k)}" class="grid"/>`).join('');
  const labels = weeks.map((_, i) => `<text x="${X(i)}" y="${Ht - 4}" text-anchor="middle" class="lbl">${i + 1}${T('wk')}</text>`).join('');
  const area = pts.length > 1 ? `<path class="area" d="M${pts[0][0]},${Y(0)} ${pts.map(p => 'L' + p[0] + ',' + p[1]).join(' ')} L${pts[pts.length - 1][0]},${Y(0)} Z"/>` : '';
  const line = pts.length > 1 ? `<polyline class="ln" points="${pts.map(p => p.join(',')).join(' ')}"/>` : '';
  const dots = pts.map((p, i) => `<rect x="${p[0] - 3}" y="${p[1] - 3}" width="6" height="6" class="${i === pts.length - 1 ? 'dot last' : 'dot'}"/>`).join('');
  const peak = n ? `<text x="${Wd - pr}" y="10" text-anchor="end" class="lbl">${T('peak')}: ${money(max)}</text>` : '';
  return `<svg viewBox="0 0 ${Wd} ${Ht}" class="linechart" role="img" aria-label="${T('boxoffice')}">${grid}${area}${line}${dots}${labels}${peak}</svg>`;
}

// Pixel confetti for big moments.
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confetti';
  cv.width = Math.round(innerWidth / 4); cv.height = Math.round(innerHeight / 4);
  document.body.appendChild(cv);
  const x = cv.getContext('2d'), cols = ['#f2b441', '#d0412e', '#8fd8f0', '#f4e7d2', '#c04aa0', '#3d9a6c'];
  const parts = Array.from({ length: 90 }, () => ({ x: cv.width / 2 + rand(-20, 20), y: cv.height * .45, vx: rand(-2.2, 2.2), vy: rand(-3.6, -1), c: pick(cols), s: Math.random() < .3 ? 2 : 1 }));
  let t = 0;
  const step = () => {
    x.clearRect(0, 0, cv.width, cv.height);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .09; p.vx *= .99; x.fillStyle = p.c; x.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
    if (++t < 90) requestAnimationFrame(step); else cv.remove();
  };
  requestAnimationFrame(step);
}

    feeMult: {}, busy: {}, release: null };

  for (const p of ACTORS.concat(WRITERS)) { W.feeMult[p.id] = Math.round(rand(.7, 1.4) * 100) / 100; if (Math.random() < .2) W.busy[p.id] = true; }
  const free = list => list.filter(p => unlocked(TIER_REQ[p.tier]) && !W.busy[p.id]).length;
  if (free(ACTORS) < 3 || free(WRITERS) < 1) W.busy = {};
  for (const p of ACTORS) if (refuses(p.id)) W.busy[p.id] = 'refuse';
  screen = 'wizard'; render(); window.scrollTo(0, 0);

function wizardCost() {
  if (!W) return 0;
  const era = byId(ERAS, W.era), b = byId(BUDGETS, W.budget), m = byId(MARKETING, W.mkt);
  let c = budgetCost(b, era) + mktCost(m);
  if (W.writer) c += feeOf(byId(WRITERS, W.writer));
  if (W.lead) c += feeOf(byId(ACTORS, W.lead), true);
  if (W.co) c += feeOf(byId(ACTORS, W.co), true);
  return Math.round(c);
}
function stepValid(s) {
  if (s === 0) return !!W.genre;
  if (s === 1) return !!W.theme;
  if (s === 2) return !!W.era && !!W.rating;
  if (s === 3) return W.writer && W.lead && W.co && W.lead !== W.co;
  if (s === 4) return wizardCost() <= G.money + creditLine() && W.release !== null;
  if (s === 5) return W.focus.reduce((a, b) => a + b, 0) === 10 && W.title.trim() && wizardCost() <= G.money + creditLine();

function rivalScale() {

function critiqueAll(base, genre) {

// Contracts: a producer's request with a reward. One at a time, expires after two films.
function ensureContract() {
  if (G.contract || !G.started) return;
  const g = pick(GENRES.filter(x => unlocked(x.req))), t = pick(THEMES.filter(x => unlocked(x.req))), e = pick(ERAS.filter(x => unlocked(x.req)));
  const base = Math.round(30000 * (1 + G.level * .6) / 1000) * 1000;
  const kinds = [
    { kind: 'genreCrit', genre: g.id, crit: 55 + Math.min(30, G.level * 3), reward: base * 1.6 },
    { kind: 'themeEra', theme: t.id, era: e.id, reward: base * 1.3 },
    { kind: 'indie', genre: g.id, reward: base, rep: 3 },
    { kind: 'gross', gross: Math.round(rivalScale() * 1.3 / 10000) * 10000, reward: base * 2 },
    { kind: 'rating', genre: g.id, rating: pick(['0', '18']), reward: base * 1.1 },
  ];
  G.contract = Object.assign(pick(kinds), { left: 2 });
}
function contractText(c) {
  const g = c.genre && L(byId(GENRES, c.genre)), t = c.theme && L(byId(THEMES, c.theme)), e = c.era && L(byId(ERAS, c.era));
  const ru = G.lang === 'ru';
  switch (c.kind) {
    case 'genreCrit': return ru ? `Стриминг ищет жанр «${g}» с оценкой критиков от ${c.crit}.` : `A streamer wants a ${g} film rated ${c.crit}+ by critics.`;
    case 'themeEra': return ru ? `Спонсор оплатит фильм на тему «${t}», эпоха: ${e}.` : `A sponsor will pay for a "${t}" film set in: ${e}.`;
    case 'indie': return ru ? `Фестиваль ждёт инди-фильм в жанре «${g}» (бюджет «Инди»).` : `A festival wants an Indie-budget ${g} film.`;
    case 'gross': return ru ? `Продюсеру нужен хит: сборы от ${money(c.gross)}.` : `A producer wants a hit grossing ${money(c.gross)}+.`;
    case 'rating': return ru ? `Телеканалу нужен фильм «${g}» с рейтингом ${c.rating}+.` : `A TV channel wants a ${g} film rated ${c.rating}+.`;
  }
  return '';
}
function contractMet(c, f) {
  switch (c.kind) {
    case 'genreCrit': return f.genre === c.genre && f.critic >= c.crit;
    case 'themeEra': return f.theme === c.theme && f.era === c.era;
    case 'indie': return f.genre === c.genre && f.budget === 'indie';
    case 'gross': return f.gross >= c.gross;
    case 'rating': return f.genre === c.genre && f.rating === c.rating;
  }
  return false;

/* ---------- Production ---------- */
function startProduction() {
  const cost = wizardCost();
  if (cost > G.money + creditLine()) { toast(T('notEnough')); haptic('err'); return; }
  G.money -= cost;
  // Two things will happen during the shoot: either a decision or plain chaos.
  const choices = EVENTS.slice().sort(() => Math.random() - .5), chaos = CHAOS.slice().sort(() => Math.random() - .5);
  const events = [0, 1].map(i => Math.random() < .5 ? { kind: 'choice', idx: EVENTS.indexOf(choices[i]) } : { kind: 'chaos', idx: CHAOS.indexOf(chaos[i]) });
  P = { draft: Object.assign({}, W), cost, progress: 0, stage: 0, events, at: [30 + Math.floor(rand(0, 10)), 65 + Math.floor(rand(0, 15))], evIdx: 0, pending: null, fx: {}, extra: 0, log: [] };
  G.prod = P; W = null; screen = 'production'; save(); render(); haptic('medium');
  tickProduction();
}
let prodTimer, setTimer;
function tickProduction() {
  clearInterval(prodTimer);
  prodTimer = setInterval(() => {
    if (!P || screen !== 'production') return clearInterval(prodTimer);
    if (P.pending) return;
    if (P.evIdx < 2 && P.progress >= P.at[P.evIdx]) { openEvent(); return; }
    P.progress = Math.min(100, P.progress + 2);
    P.stage = Math.min(3, Math.floor(P.progress / 25));
    if (P.progress >= 100) { clearInterval(prodTimer); render(); haptic('ok'); return; }
    const bar = $('.progress i'), st = $('#stage');
    if (bar) bar.style.width = P.progress + '%';
    if (st) st.textContent = T('prod')[P.stage];
  }, 70);
}
function mergeFx(fx) {
  for (const [k, v] of Object.entries(fx)) {
    if (k === 'reach') P.fx.reach = (P.fx.reach || 1) * v;
    else if (typeof v === 'number') P.fx[k] = (P.fx[k] || 0) + v;
    else P.fx[k] = v;
  }
}
function payExtra(fx) {
  const d = P.draft, base = budgetCost(byId(BUDGETS, d.budget), byId(ERAS, d.era));
  const extra = (fx.cost || 0) + (fx.costPct ? Math.round(base * fx.costPct) : 0) + (fx.feePct ? Math.round(feeOf(byId(ACTORS, d.lead), true) * fx.feePct) : 0);
  G.money -= extra; P.extra += extra;
  return extra;
}
function openEvent() {
  const e = P.events[P.evIdx];
  if (e.kind === 'chaos') {
    const ev = CHAOS[e.idx], fx = ev.fx();
    const extra = payExtra(fx); mergeFx(fx);
    P.pending = { kind: 'chaos', text: L(ev), extra };
    P.log.push(L(ev));
  } else P.pending = { kind: 'choice', idx: e.idx };
  P.anim = e.kind === 'chaos' ? CHAOS_ANIM[e.idx] : EVENT_ANIM[EVENTS[e.idx].id];
  save(); render(); haptic('warn');
}
function chooseEvent(v) {
  const ev = EVENTS[P.pending.idx], opt = ev[v], fx = Object.assign({}, opt.fx);
  const base = budgetCost(byId(BUDGETS, P.draft.budget), byId(ERAS, P.draft.era));
  if ((fx.cost || 0) + (fx.costPct ? base * fx.costPct : 0) + (fx.feePct ? feeOf(byId(ACTORS, P.draft.lead), true) * fx.feePct : 0) > G.money + creditLine()) { toast(T('notEnough')); haptic('err'); if (v === 'a') return chooseEvent('b'); }
  let note = '';
  // Fate does not always cooperate: sometimes a decision backfires, sometimes it pays off twice.
  const roll = Math.random();
  if (roll < .18) { for (const k of ['q', 'hype', 'crit', 'act']) if (fx[k]) fx[k] = -fx[k]; if (!fx.q) fx.q = -.4; note = T('backfire'); }
  else if (roll > .88) { for (const k of ['q', 'hype', 'crit', 'act']) if (fx[k]) fx[k] *= 2; if (!fx.hype) fx.hype = .3; note = T('jackpot'); }
  payExtra(fx); mergeFx(fx);
  P.log.push(L(ev) + ' <b>' + L(opt) + '.</b>' + (note ? ' ' + note : ''));
  P.pending = null; P.evIdx++;
  if (roll < .18) P.anim = 'glitch'; else if (roll > .88) P.anim = 'money';
  P.animUntil = Date.now() + 2200;
  if (note) toast(note);
  save(); render(); haptic(note ? 'warn' : 'light'); tickProduction();
}
function closeChaos() { P.animUntil = Date.now() + 2200; P.pending = null; P.evIdx++; save(); render(); tickProduction(); }

// Tycoon-style premiere: numbers tick up one after another so the outcome stays a mystery.
const sleep = ms => new Promise(r => setTimeout(r, R && R.skip ? 0 : ms));
function countUp(el, to, ms, fmt, cls, from = 0) {
  return new Promise(done => {
    if (!el) return done();
    const t0 = performance.now();
    const step = now => {
      if (!R || (el.nodeType && !document.body.contains(el))) return done();
      const k = R.skip ? 1 : Math.min(1, (now - t0) / ms);
      // ease-out with a nervous wobble near the end
      const e = 1 - Math.pow(1 - k, 3), wob = k < 1 ? Math.sin(now / 45) * (1 - k) * .08 * (to - from) : 0;
      const v = from + (to - from) * e + wob;
      el.textContent = fmt(Math.round(v));
      if (cls) el.className = el.className.replace(/\b(hi|mid|lo|wait)\b/g, '').trim() + ' ' + cls(Math.round(v));
      if (k < 1) requestAnimationFrame(step); else { el.textContent = fmt(to); done(); }
    };
    requestAnimationFrame(step);
  });
}
const showEl = el => { if (el) { el.hidden = false; el.classList.add('pop'); } };
async function revealResults() {
  const { film: f, s } = R;
  const barBtn = $('.bottombar [data-act="closeResults"]');
  if (!R || R.skip) return;
  await sleep(500);
  if (!R || R.skip) return;
  showEl($('#r-critics'));
  for (let i = 0; i < R.critics.length; i++) { if (!R || R.skip) return; await countUp($('#r-k' + i), R.critics[i].score, 800, v => v, scoreClass); haptic('light'); await sleep(250); }
  await countUp($('#r-critic'), f.critic, 900, v => v, scoreClass); haptic(f.critic >= 70 ? 'ok' : f.critic < 40 ? 'err' : 'light');
  if (f.critic >= 75 && R && !R.skip) confetti();
  if (!R || R.skip) return;
  await sleep(400);
  if (!R || R.skip) return;
  await countUp($('#r-aud'), f.aud, 1500, v => v, scoreClass); haptic('light');
  if (!R || R.skip) return;
  await sleep(500);
  const line = $('#r-line'), weekEl = $('#r-week'), grossEl = $('#r-gross');
  let total = 0;
  for (let i = 0; i < s.weeks.length; i++) {
    if (!R || R.skip) return;
    if (line) line.innerHTML = lineChartSVG(s.weeks, i + 1);
    if (weekEl) weekEl.textContent = `${i + 1}${T('wk')}: +${money(s.weeks[i])}`;
    const prev = total; total += s.weeks[i];
    await countUp({ set textContent(v) { if (grossEl) grossEl.textContent = v; } }, total, 550, money, null, prev);
    if (grossEl) grossEl.textContent = money(total);
    haptic('light');
    await sleep(150);
  }
  if (weekEl) weekEl.textContent = '';
  if (!R || R.skip) return;
  await sleep(300);
  if (!R || R.skip) return;
  showEl($('#r-chart'));
  if (!R || R.skip) return;
  await sleep(900);
  if (!R || R.skip) return;
  showEl($('#r-ledger'));
  if (!R || R.skip) return;
  await countUp($('#r-profit'), s.profit, 1100, money); haptic(s.profit >= 0 ? 'ok' : 'err');
  if (!R || R.skip) return;
  await sleep(400);
  if (!R || R.skip) return;
  showEl($('#r-reviews'));
  if (!R || R.skip) return;
  await sleep(700);
  if (!R || R.skip) return;
  showEl($('#r-story'));
  for (const li of document.querySelectorAll('#r-story li')) { if (!R || R.skip) return; showEl(li); await sleep(650); }
  if (!R || R.skip) return;
  showEl($('#r-similar'));
  if (!R || R.skip) return;
  await sleep(300);
  if (!R || R.skip) return;
  showEl($('#r-gains'));
  if (R.leveled) confetti();
  if (R) R.revealed = true;
  if (barBtn) barBtn.textContent = T('toStudio');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const ext = e.target.closest('a[data-ext]');
  if (ext && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(ext.href); } catch (err) { window.open(ext.href, '_blank'); } return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (el.dataset.locked) { toast(el.dataset.why || T('locked')); haptic('warn'); return; }
  switch (act) {
    case 'lang': G.lang = G.lang === 'ru' ? 'en' : 'ru'; save(); render(); break;
    case 'setlang': G.lang = v; save(); render(); break;
    case 'begin': {
      G.director = ($('#in-dir').value || '').trim() || (G.lang === 'ru' ? 'Режиссёр' : 'Director');
      G.studio = ($('#in-studio').value || '').trim() || T('defStudio');
      G.started = true; ensureTrends(); save(); screen = 'home'; render(); haptic('ok'); break;
    }
    case 'tab': screen = v; resetArm = false; render(); window.scrollTo(0, 0); haptic('light'); break;
    case 'newFilm': startWizard(); haptic('medium'); break;
    case 'gig': G.money += gigPay() - 2 * upkeepPerMonth(); payInterest(2); G.xp += 20; G.month += 2; checkDebt(); if (careerOver()) { screen = 'legacy'; save(); render(); break; } while (G.xp >= xpNeed(G.level)) { G.xp -= xpNeed(G.level); G.level++; G.points++; }
      ensureTrends(); save(); render(); toast(T('gigDone').replace('{m}', money(gigPay()))); haptic('ok'); break;
    case 'sequel': {
      const f = G.films.find(x => x.id === +v); if (!f) break;
      Object.assign(W, { sequelOf: f.id, genre: f.genre, theme: f.theme, era: f.era, rating: f.rating, title: baseTitle(f) + ' ' + ((f.part || 1) + 1), titleEdited: true, step: 3 });
      if (!W.busy[f.lead]) W.lead = f.lead;
      if (!W.busy[f.co] && f.co !== W.lead) W.co = f.co;
      render(); window.scrollTo(0, 0); haptic('medium'); break;
    }
    case 'genre': W.genre = v; if (!W.titleEdited) W.title = ''; render(); haptic('light'); break;
    case 'theme': W.theme = v; if (!W.titleEdited) W.title = ''; render(); haptic('light'); break;
    case 'era': W.era = v; render(); haptic('light'); break;
    case 'rating': W.rating = v; render(); haptic('light'); break;
    case 'writer': W.writer = v; render(); haptic('light'); break;
    case 'lead': W.lead = v; render(); haptic('light'); break;
    case 'co': W.co = v; render(); haptic('light'); break;
    case 'budget': W.budget = v; if (!releaseOptions(v).includes(W.release)) W.release = releaseOptions(v)[0]; render(); haptic('light'); break;
    case 'release': W.release = +v; render(); haptic('light'); break;
    case 'mkt': W.mkt = v; render(); haptic('light'); break;
    case 'fplus': { const i = +v, used = W.focus.reduce((a, b) => a + b, 0); if (used < 10 && W.focus[i] < 10) { W.focus[i]++; render(); haptic('light'); } break; }
    case 'fminus': { const i = +v; if (W.focus[i] > 0) { W.focus[i]--; render(); haptic('light'); } break; }
    case 'reroll': W.title = genTitle(W.genre, W.theme); W.titleEdited = false; render(); haptic('light'); break;
    case 'wnext': if (stepValid(W.step)) { W.step++; if (W.step === 5 && !W.title) W.title = genTitle(W.genre, W.theme); render(); window.scrollTo(0, 0); haptic('light'); } break;
    case 'wback': wizardBack(); break;
    case 'shoot': startProduction(); break;
    case 'evt': chooseEvent(v); break;
    case 'chaosOk': closeChaos(); break;
    case 'dismissNews': G.news = null; save(); render(); break;
    case 'premiere': release(); break;
    case 'share': if (R) shareFilm(R.film); break;
    case 'closeResults': if (R && !R.revealed) { R.skip = true; R.revealed = true; render(); break; } screen = G.pendingAwards && G.pendingAwards.any ? 'awards' : careerOver() ? 'legacy' : 'home'; if (screen !== 'awards') { G.pendingAwards = null; if (screen === 'home') rollWorldEvent(); } R = null; save(); render(); window.scrollTo(0, 0); break;
    case 'closeAwards': G.pendingAwards = null; screen = careerOver() ? 'legacy' : 'home'; if (screen === 'home') rollWorldEvent(); save(); render(); window.scrollTo(0, 0); break;
    case 'sell': { const u = byId(UPGRADES, v); if (has(v)) { G.money += Math.round(upCost(u) * TUNE.refund); delete G.upgrades[v]; checkDebt(); save(); render(); toast(`${T('sold')}: ${L(u)}`); haptic('warn'); } break; }
    case 'buy': { const u = byId(UPGRADES, v); if (!has(v) && unlocked(u.req) && G.money >= upCost(u)) { G.money -= upCost(u); G.upgrades[v] = true; checkGoals(); save(); render(); toast(`${T('unlockedNew')}: ${L(u)}`); haptic('ok'); } break; }
    case 'skill': if (G.points > 0 && G.skills[v] < SKILL_MAX) { G.skills[v]++; G.points--; save(); render(); haptic('medium'); } break;

    case 'reset': if (!resetArm) { resetArm = true; render(); } else { const lang = G.lang; G = newGame(lang); resetArm = false; screen = 'onboard'; save(); render(); } break;
  }
});
