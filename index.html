/* Layout: one-column mobile app (max 560px) — marquee header, scrolling screen, fixed bottom nav / wizard bar.
   Look: a velvet screening room. Burgundy velvet ground, cream ticket-stock cards, marquee-bulb amber accent. */
:root {
  --velvet: #1b0d12;
  --velvet-2: #26131a;
  --card: #2f1820;
  --card-2: #3a1f28;
  --line: #4d2c37;
  --cream: #f4e7d2;
  --muted: #b89c92;
  --bulb: #f2b441;
  --bulb-dim: #8a6424;
  --good: #8fcf8f;
  --bad: #ec7a68;
  --info: #8fb8d8;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
/* Pixelify's Cyrillic glyphs read oddly (Y-shaped У, hooked К), so Russian uses Tiny5. */
html[lang="ru"] { --display: "Tiny5", "Pixelify Sans", "Courier New", monospace; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--velvet); color: var(--cream);
  font: 15px/1.45 var(--body);
  background-image: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 22px), radial-gradient(120% 60% at 50% 0%, #3a1520 0%, var(--velvet) 70%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--bulb); outline-offset: 2px; }
#app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 110px; min-height: 100%; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .02em; text-wrap: balance; margin: 0; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }

/* Marquee header: the one bold element */
.marquee {
  position: relative; border-radius: 14px; padding: 14px 16px 12px;
  background: linear-gradient(180deg, #4a1a24, #2a1118);
  border: 1px solid #5d2a35;
}
.marquee::before {
  content: ""; position: absolute; inset: 5px; border-radius: 10px; pointer-events: none;
  background:
    radial-gradient(circle, var(--bulb) 0 2px, transparent 3px) 0 0 / 14px 100% repeat-x,
    radial-gradient(circle, var(--bulb) 0 2px, transparent 3px) 0 100% / 14px 6px repeat-x;
  background-position: 7px 0, 7px 100%;
  -webkit-mask: linear-gradient(#000 0 0) top / 100% 6px no-repeat, linear-gradient(#000 0 0) bottom / 100% 6px no-repeat;
          mask: linear-gradient(#000 0 0) top / 100% 6px no-repeat, linear-gradient(#000 0 0) bottom / 100% 6px no-repeat;
  animation: bulbs 1.6s steps(2) infinite;
  opacity: .9;
}
@keyframes bulbs { 50% { opacity: .45; } }
.marquee .studio { font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; line-height: 1.05; color: var(--bulb); text-shadow: 0 0 18px rgba(242,180,65,.35); padding-top: 6px; }
.marquee .sub { font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.stat { background: rgba(0,0,0,.22); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.stat b { display: block; font-family: var(--mono); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.langbtn { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; font-family: var(--mono); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.ticket { position: relative; background: var(--cream); color: #2a1218; border-radius: 10px; padding: 14px 16px; }
.ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--velvet); }
.ticket::before { left: -8px; } .ticket::after { right: -8px; }
.ticket .muted { color: #6e4a48; }

.btn { border: 0; border-radius: 10px; padding: 12px 16px; font-family: var(--display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: var(--card-2); border: 1px solid var(--line); }
.btn.primary { background: var(--bulb); color: #2a1218; border-color: var(--bulb); box-shadow: 0 0 22px rgba(242,180,65,.25); }
.btn.big { width: 100%; padding: 16px; font-size: 20px; }
.btn:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn.sm { padding: 7px 12px; font-size: 14px; }
.btn:active:not(:disabled) { transform: translateY(1px); }

/* Choice grids */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.opt { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt .t { font-family: var(--display); font-size: 17px; font-weight: 500; text-transform: uppercase; }
.opt .d { font-size: 12px; color: var(--muted); }
.opt.sel { border-color: var(--bulb); background: #43231c; box-shadow: inset 0 0 0 1px var(--bulb); }
.opt.locked { opacity: .45; }
.opt .tag { position: absolute; top: 8px; right: 8px; font-size: 11px; font-family: var(--mono); padding: 1px 6px; border-radius: 99px; background: rgba(0,0,0,.3); }
.tag.g2 { color: var(--good); } .tag.g1 { color: #c6e3a0; } .tag.g0 { color: var(--muted); } .tag.gm { color: var(--bad); } .tag.hot { color: var(--bulb); }
.swatch { width: 100%; height: 4px; border-radius: 2px; margin-bottom: 6px; }

.opt.person { flex-direction: row; gap: 10px; align-items: center; text-align: left; }
.avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 16px; color: #2a1218; }
.person .info { min-width: 0; flex: 1; }
.person .name { font-weight: 600; font-size: 15px; }
.bars { display: flex; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.bars b { color: var(--cream); font-family: var(--mono); font-weight: 500; }
.fee { font-family: var(--mono); font-size: 13px; color: var(--bulb); white-space: nowrap; }

.steps { display: flex; gap: 4px; margin-block: 4px 12px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--bulb); }

.focusrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding-block: 8px; border-bottom: 1px dashed var(--line); }
.focusrow:last-child { border-bottom: 0; }
.pips { display: flex; gap: 4px; grid-column: 1 / -1; }
.pips i { flex: 1; height: 10px; border-radius: 3px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }
.pips i.on { background: var(--bulb); border-color: var(--bulb); }
.pips i.ideal { border-color: var(--good); border-style: dashed; }
.pm { display: flex; gap: 6px; }
.pm button { width: 38px; height: 34px; border-radius: 8px; background: var(--card-2); border: 1px solid var(--line); font-size: 18px; font-family: var(--mono); }

/* Bottom bars */
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(27,13,18,.96); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(6px); }
.bottombar .inner { max-width: 528px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
.nav button { background: none; border: 0; padding: 6px 2px; border-radius: 8px; font-family: var(--display); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.nav button svg { width: 22px; height: 22px; }
.nav button.on { color: var(--bulb); background: rgba(242,180,65,.08); }

/* Posters */
.poster { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.poster .pt { font-family: var(--display); font-weight: 700; text-transform: uppercase; line-height: 1; font-size: 15px; text-shadow: 0 2px 8px rgba(0,0,0,.6); overflow-wrap: anywhere; }
.poster .py { font-family: var(--mono); font-size: 10px; opacity: .8; margin-top: 4px; }
.poster .ps { position: absolute; top: 6px; right: 6px; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.55); }
.filmlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
.filmrow { display: grid; grid-template-columns: 74px 1fr; gap: 12px; align-items: start; }
.filmrow .poster .pt { font-size: 11px; }

.score { font-family: var(--display); font-size: 56px; font-weight: 700; line-height: 1; }
.scorebox { flex: 1; text-align: center; padding: 12px 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.scorebox span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.hi { color: var(--good); } .mid { color: var(--bulb); } .lo { color: var(--bad); }

.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 10px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; min-width: 0; }
.chart .bar { width: 100%; background: linear-gradient(180deg, var(--bulb), var(--bulb-dim)); border-radius: 4px 4px 0 0; transition: height .5s ease-out; min-height: 2px; }
.chart .lbl { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.ledger { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.ledger .v { font-family: var(--mono); text-align: right; }
.ledger .total { border-top: 1px dashed var(--line); padding-top: 6px; font-weight: 600; }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.3); border: 1px solid var(--line); }

.xpbar { height: 6px; border-radius: 3px; background: rgba(0,0,0,.35); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: var(--bulb); }

.reel { width: 120px; height: 120px; margin: 10px auto; border-radius: 50%; border: 8px solid var(--bulb); position: relative; animation: spin 1.2s linear infinite; }
.reel::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle at 50% 18%, var(--velvet) 0 12px, transparent 13px), radial-gradient(circle at 82% 50%, var(--velvet) 0 12px, transparent 13px), radial-gradient(circle at 50% 82%, var(--velvet) 0 12px, transparent 13px), radial-gradient(circle at 18% 50%, var(--velvet) 0 12px, transparent 13px), var(--bulb-dim); }
.reel.stop { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { height: 10px; background: rgba(0,0,0,.35); border-radius: 5px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--bulb); transition: width .25s linear; }

.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20; background: var(--cream); color: #2a1218; padding: 10px 16px; border-radius: 10px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: pop .2s ease-out; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -8px); } }
input[type=text] { width: 100%; background: var(--velvet-2); border: 1px solid var(--line); color: var(--cream); border-radius: 8px; padding: 10px 12px; font: 16px var(--body); }
.trophy { font-family: var(--display); color: var(--bulb); }
.discover li { margin-bottom: 4px; }
.discover { padding-left: 18px; margin: 0; }
.reallink { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; color: var(--cream); text-decoration: none; padding: 8px 10px; border-radius: 8px; background: rgba(0,0,0,.22); }
.reallink:hover, .reallink:focus-visible { background: rgba(242,180,65,.12); }

.chart .bar { transition: height .45s ease-out; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }
.scene { width: 100%; height: auto; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; border: 2px solid var(--line); background: #1a0c10; }
.lot { width: 100%; height: auto; aspect-ratio: 3 / 1; display: block; border-radius: 8px; margin-top: 10px; border: 1px solid #5d2a35; }
.caps { text-transform: uppercase; letter-spacing: .08em; }
.pixel { font-family: var(--display); }
.btn.dark { background: #2a1218; color: var(--cream); border-color: #2a1218; }
.opt .gicon { width: 36px; height: 36px; margin-bottom: 4px; }
.avatar.px { border-radius: 6px; border: 2px solid rgba(0,0,0,.35); }
.poster { background-size: cover; background-position: center; }
.newsflash { display: flex; gap: 12px; align-items: flex-start; }
@media (prefers-reduced-motion: reduce) { .marquee::before, .reel { animation: none; } .chart .bar { transition: none; } }
</style>

      const parts = json.match(/[\s\S]{1,4000}/g) || [];

    if (!(inTG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast('6.9'))) return done();

      n = +n; if (err || !n) return done();

function drawSkyline(x, R, era, W, base, sil, win) {
  const P = (a, b, w, h, col) => { x.fillStyle = col || sil; x.fillRect(a, b, w, h); };

  } else if (era === 'nearfuture' || era === 'farfuture') {
    for (const [cx, r] of [[6, 5], [20, 7]]) for (let dy = 0; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); P(cx - w, base - dy, w * 2 + 1, 1); }

  } else if (era === 'ww2') {
    for (let bx = 0; bx < W; bx += 5) { const h = 3 + Math.floor(R() * 9); for (let i = 0; i < 4; i++) P(bx + i, base - h + Math.floor(R() * 3), 1, h); }

}

  const b = LOT[id], P = (a, y, w, h, col) => { x.fillStyle = col; x.fillRect(a, y, w, h); };
  const top = base - b.h;
  if (b.hangar) { for (let i = 0; i < b.w; i++) { const d = Math.abs(i - (b.w - 1) / 2), r = b.w / 2; P(bx + i, top + Math.round(r - Math.sqrt(Math.max(0, r * r - d * d)) * .8), 1, base, b.col); } P(bx + 4, base - 6, 6, 6, '#2a1a14'); return; }
  if (b.dome) { for (let i = 0; i < b.w; i++) { const d = Math.abs(i - (b.w - 1) / 2), r = b.w / 2; const hh = Math.round(Math.sqrt(Math.max(0, r * r - d * d)) * 1.6); P(bx + i, base - hh, 1, hh, b.col); } P(bx + 5, top - 4, 1, 5, '#9a9aa8'); P(bx + 5, top - 5, 1, 1, t % 2 ? '#d0412e' : '#f2b441'); return; }
  if (b.board) { P(bx + 1, base - 8, 1, 8, '#555'); P(bx + 7, base - 8, 1, 8, '#555'); P(bx, top, 9, 7, '#f4e7d2'); P(bx + 1, top + 1, 7, 5, ['#c4452f', '#2f7fa0', '#b8489b'][t % 3]); P(bx + 2, top + 2, 3, 1, '#f4e7d2'); return; }
  if (b.tower) { P(bx + 1, base - 10, 1, 10, '#777'); P(bx + 6, base - 10, 1, 10, '#777'); P(bx, top, 8, 8, b.col); P(bx + 1, top + 2, 6, 1, '#9a9aa8'); P(bx + 3, top - 2, 2, 2, b.col); return; }
  if (b.dish) { P(bx + 3, top + 4, 2, b.h - 4, b.col); P(bx, top, 8, 2, '#d8d8e0'); P(bx + 1, top + 2, 6, 1, '#d8d8e0'); P(bx + 3, top - 2, 1, 2, '#9a9aa8'); P(bx + 4, top + 7, 1, 1, t % 2 ? '#8fd8f0' : '#2f7fa0'); return; }
  P(bx, top, b.w, b.h, b.col);
  P(bx, top, b.w, 1, 'rgba(255,255,255,.18)');
  for (let wy = top + 2; wy < base - 4; wy += 3) for (let wx = bx + 1; wx < bx + b.w - 1; wx += 2) P(wx, wy, 1, 1, ((wx + wy + t) % 5) ? '#f2d58a' : '#3a2a2a');
  P(bx + Math.floor(b.w / 2) - 1, base - 3, 2, 3, '#2a1a14');
  if (b.awning) for (let i = 0; i < b.w; i++) P(bx + i, base - 5, 1, 1, i % 2 ? '#f4e7d2' : '#c4452f');
  if (b.em) P(bx + Math.floor(b.w / 2) - 1, top - 3, 3, 3, PX[b.em]);
  if (b.flag) { P(bx + 1, top - 5, 1, 5, '#ddd'); P(bx + 2, top - 5, 3, 2, '#2f7fa0'); }
  if (b.marquee) { P(bx - 1, base - 7, b.w + 2, 3, '#f4e7d2'); for (let i = 0; i < b.w + 2; i += 2) P(bx - 1 + i + (t % 2), base - 8, 1, 1, '#f2b441'); P(bx + 2, base - 6, b.w - 4, 1, '#7a1f24'); }
}
function studioURL(t) {
  const W = 144, H = 48, base = 40, c = mkCanvas(W, H), x = c.getContext('2d');
  const night = Math.floor(G.month / 2) % 3 === 2;
  ditherSky(x, W, base, night ? '#0a0614' : '#3a1530', night ? '#3a2050' : '#e8743a', 5);
  if (night) { const R = rng('stars'); for (let i = 0; i < 30; i++) { x.fillStyle = '#f4e7d2'; x.fillRect(Math.floor(R() * W), Math.floor(R() * 24), 1, 1); } }
  else { x.fillStyle = '#ffd36a'; x.fillRect(120, 12, 6, 6); x.fillRect(119, 13, 8, 4); }
  x.fillStyle = '#1e1014'; x.fillRect(0, 26, W, 14);
  for (let i = 0; i < W; i += 7) { x.fillStyle = '#2a1520'; x.fillRect(i, 22 + (i * 7) % 5, 5, 18); }
  x.fillStyle = '#2a1a14'; x.fillRect(0, base, W, H - base);
  x.fillStyle = '#4a3a30'; for (let i = 0; i < W; i += 6) x.fillRect(i, 44, 3, 1);
  // garage: where it all started
  x.fillStyle = '#7a5a4a'; x.fillRect(2, base - 10, 12, 10); x.fillStyle = '#5c3a1e'; x.fillRect(1, base - 11, 14, 1);
  for (let i = 0; i < 4; i++) { x.fillStyle = i % 2 ? '#9a9aa8' : '#7a7a88'; x.fillRect(4, base - 7 + i * 2, 8, 2); }
  x.fillStyle = '#f2b441'; x.fillRect(4, base - 9, 8, 1);
  let bx = 17;
  for (const u of UPGRADES) {
    const b = LOT[u.id];
    if (has(u.id)) drawBuilding(x, bx, base, u.id, t);
    else { x.fillStyle = '#4a3a30'; x.fillRect(bx + Math.floor(b.w / 2), base - 4, 1, 4); x.fillStyle = '#f4e7d2'; x.fillRect(bx + Math.floor(b.w / 2) - 2, base - 6, 5, 3); x.fillStyle = '#c4452f'; x.fillRect(bx + Math.floor(b.w / 2) - 1, base - 5, 3, 1); }
    bx += b.w + 1;
    if (bx > W - 6) break;
  }
  return c.toDataURL();
}
function lotThumb(id) {
  const key = 'u' + id; if (pxCache[key]) return pxCache[key];
  const b = LOT[id], c = mkCanvas(b.w + 4, 24), x = c.getContext('2d');
  drawBuilding(x, 2, 22, id, 0);
  x.fillStyle = '#4a3a30'; x.fillRect(0, 22, b.w + 4, 2);
  return (pxCache[key] = c.toDataURL());
}

// The film set during production: camera, crew light and the two leads, animated at 6 fps.
function drawSet(cv, frame, d) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height;
  const P = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  P(0, 0, W, H, '#1a0c10');
  const [top, bottom, acc] = POSTER_PAL[d.genre] || POSTER_PAL.drama;
  for (let j = 4; j < 26; j++) for (let i = 30; i < 62; i++) { const v = (j - 4) / 22 * 3 + BAYER[j % 4][i % 4] / 16 - .5; x.fillStyle = mix(top, bottom, clamp(Math.round(v), 0, 3) / 3); x.fillRect(i, j, 1, 1); }
  P(29, 3, 34, 1, '#5c3a1e'); P(29, 26, 34, 1, '#5c3a1e');
  for (let i = 0; i < W; i += 4) P(i + (Math.floor(i / 4) % 2) * 2, 30, 2, 1, '#3a2228');
  P(0, 31, W, H - 31, '#24121a');
  for (let i = 0; i < W; i += 4) P(i, 31 + ((i / 4) % 2), 2, 1, '#301a22');
  // light cone
  if (frame % 9 !== 0) { x.fillStyle = 'rgba(242,180,65,.13)'; for (let j = 0; j < 28; j++) x.fillRect(40 - j / 2, 4 + j, 14 + j, 1); }
  P(44, 0, 6, 4, '#555'); P(45, 3, 4, 1, '#f2b441');
  // actors
  const faceA = faceURL(d.lead, '#00000000'), faceB = faceURL(d.co, '#00000000');
  const bob = frame % 4 < 2 ? 0 : 1;
  const imgs = drawSet.imgs || (drawSet.imgs = {});
  for (const [src, ax, off] of [[faceA, 38, bob], [faceB, 50, 1 - bob]]) {
    let im = imgs[src]; if (!im) { im = imgs[src] = new Image(); im.src = src; }
    if (im.complete) x.drawImage(im, ax, 14 + off);
    P(ax + 2, 26 + off, 8, 5 - off, '#3a3a5a');
  }
  // camera on tripod
  P(6, 12, 12, 7, '#2a2a33'); P(18, 13, 3, 5, '#55556a'); P(19, 14, 2, 3, frame % 6 < 3 ? '#d0412e' : '#5a1010');
  P(7, 9, 4, 3, '#2a2a33'); P(12, 9, 4, 3, '#2a2a33'); P(8, 10, 2, 1, '#55556a'); P(13, 10, 2, 1, '#55556a');
  P(11, 19, 2, 6, '#55556a'); P(8, 25, 2, 6, '#55556a'); P(14, 25, 2, 6, '#55556a'); P(10, 24, 4, 1, '#55556a');
  // the clapper snaps every few seconds
  if (frame % 24 < 4) { P(22, 6, 6, 4, '#f4e7d2'); P(22, 6, 6, 1, frame % 24 < 2 ? '#140a0c' : '#f4e7d2'); P(22, frame % 24 < 2 ? 5 : 4, 6, 1, '#140a0c'); }
}

/* ---------- Wizard ---------- */
const STEPS = 6;
function startWizard() {
  ensureTrends();
  const last = G.films[G.films.length - 1];
  W = { step: 0, genre: null, theme: null, era: 'modern', rating: null, writer: null, lead: null, co: null,
    budget: last && unlocked(byId(BUDGETS, last.budget).req) ? last.budget : 'indie', mkt: 'small', focus: [3, 3, 2, 2], title: '', titleEdited: false,
    feeMult: {}, busy: {} };
  // Talent is fickle: fees swing every time and some people are busy elsewhere.
  for (const p of ACTORS.concat(WRITERS)) { W.feeMult[p.id] = Math.round(rand(.7, 1.4) * 100) / 100; if (Math.random() < .2) W.busy[p.id] = true; }
  const free = list => list.filter(p => unlocked(TIER_REQ[p.tier]) && !W.busy[p.id]).length;
  if (free(ACTORS) < 3 || free(WRITERS) < 1) W.busy = {};
  screen = 'wizard'; render(); window.scrollTo(0, 0);
}
function wizardCost() {
  if (!W) return 0;
  const era = byId(ERAS, W.era), b = byId(BUDGETS, W.budget), m = byId(MARKETING, W.mkt);
  let c = b.cost * era.mult + mktCost(m);
  if (W.writer) c += feeOf(byId(WRITERS, W.writer));
  if (W.lead) c += feeOf(byId(ACTORS, W.lead), true);
  if (W.co) c += feeOf(byId(ACTORS, W.co), true);
  return Math.round(c);

}

function rollWorldEvent() {
  if (!G.films.length || Math.random() > .5) return;
  let ev = pick(WORLD);
  if (ev.cult && !G.films.some(f => f.critic < 50)) ev = WORLD[1];
  let text = L(ev);
  if (ev.run) ev.run();
  if (ev.actor) {
    const a = pick(ACTORS.filter(a => unlocked(TIER_REQ[a.tier]))), c = G.cast[a.id] || (G.cast[a.id] = { skill: 0, star: 0 });
    c.star = clamp(c.star + 2 * ev.actor, -2, 4);
    text = text.replace('{a}', L(a));
  }
  if (ev.cult) { const f = pick(G.films.filter(f => f.critic < 50)), bonus = Math.round(Math.max(30000, f.gross * rand(.3, .8))); G.money += bonus; f.cult = true; text += ` «${f.title}»: +${money(bonus)}`; }

}

/* ---------- Production ---------- */
function startProduction() {
  const cost = wizardCost();
  if (cost > G.money) { toast(T('notEnough')); haptic('err'); return; }
  G.money -= cost;
  // Two things will happen during the shoot: either a decision or plain chaos.
  const choices = EVENTS.slice().sort(() => Math.random() - .5), chaos = CHAOS.slice().sort(() => Math.random() - .5);
  const events = [0, 1].map(i => Math.random() < .5 ? { kind: 'choice', idx: EVENTS.indexOf(choices[i]) } : { kind: 'chaos', idx: CHAOS.indexOf(chaos[i]) });
  P = { draft: Object.assign({}, W), cost, progress: 0, stage: 0, events, at: [30 + Math.floor(rand(0, 10)), 65 + Math.floor(rand(0, 15))], evIdx: 0, pending: null, fx: {}, extra: 0, log: [] };
  G.prod = P; W = null; screen = 'production'; save(); render(); haptic('medium');
  tickProduction();
}
let prodTimer, setTimer;
function tickProduction() {
  clearInterval(prodTimer);
  prodTimer = setInterval(() => {
    if (!P || screen !== 'production') return clearInterval(prodTimer);
    if (P.pending) return;
    if (P.evIdx < 2 && P.progress >= P.at[P.evIdx]) { openEvent(); return; }
    P.progress = Math.min(100, P.progress + 2);
    P.stage = Math.min(3, Math.floor(P.progress / 25));
    if (P.progress >= 100) { clearInterval(prodTimer); render(); haptic('ok'); return; }
    const bar = $('.progress i'), st = $('#stage');
    if (bar) bar.style.width = P.progress + '%';
    if (st) st.textContent = T('prod')[P.stage];
  }, 70);
}
function mergeFx(fx) {
  for (const [k, v] of Object.entries(fx)) {
    if (k === 'reach') P.fx.reach = (P.fx.reach || 1) * v;
    else if (typeof v === 'number') P.fx[k] = (P.fx[k] || 0) + v;
    else P.fx[k] = v;
  }
}
function payExtra(fx) {
  const d = P.draft, base = byId(BUDGETS, d.budget).cost * byId(ERAS, d.era).mult;
  const extra = (fx.cost || 0) + (fx.costPct ? Math.round(base * fx.costPct) : 0);
  G.money -= extra; P.extra += extra;
  return extra;
}
function openEvent() {
  const e = P.events[P.evIdx];
  if (e.kind === 'chaos') {
    const ev = CHAOS[e.idx], fx = ev.fx();
    const extra = payExtra(fx); mergeFx(fx);
    P.pending = { kind: 'chaos', text: L(ev), extra };
    P.log.push(L(ev));
  } else P.pending = { kind: 'choice', idx: e.idx };
  save(); render(); haptic('warn');
}
function chooseEvent(v) {
  const ev = EVENTS[P.pending.idx], opt = ev[v], fx = Object.assign({}, opt.fx);
  const base = byId(BUDGETS, P.draft.budget).cost * byId(ERAS, P.draft.era).mult;
  if ((fx.cost || 0) + (fx.costPct ? base * fx.costPct : 0) > G.money) { toast(T('notEnough')); haptic('err'); if (v === 'a') return chooseEvent('b'); }
  let note = '';
  // Fate does not always cooperate: sometimes a decision backfires, sometimes it pays off twice.
  const roll = Math.random();
  if (roll < .18) { for (const k of ['q', 'hype', 'crit', 'act']) if (fx[k]) fx[k] = -fx[k]; if (!fx.q) fx.q = -.4; note = T('backfire'); }
  else if (roll > .88) { for (const k of ['q', 'hype', 'crit', 'act']) if (fx[k]) fx[k] *= 2; if (!fx.hype) fx.hype = .3; note = T('jackpot'); }
  payExtra(fx); mergeFx(fx);
  P.log.push(L(ev) + ' → ' + L(opt) + (note ? ' ' + note : ''));
  P.pending = null; P.evIdx++;
  if (note) toast(note);
  save(); render(); haptic(note ? 'warn' : 'light'); tickProduction();
}
function closeChaos() { P.pending = null; P.evIdx++; save(); render(); tickProduction(); }
function vProduction() {
  const d = P.draft, done = P.progress >= 100, pend = P.pending;
  let card = '';
  if (pend && pend.kind === 'choice') {
    const ev = EVENTS[pend.idx];
    card = `<div class="ticket stack" style="text-align:left;gap:10px"><div class="row"><img class="px" src="${spriteURL('clapper')}" width="24" height="24" alt=""><div class="muted small caps">${T('decision')}</div></div>
      <div style="font-size:17px;font-weight:500">${L(ev)}</div>
      <button class="btn primary" data-act="evt" data-v="a">${L(ev.a)}</button>
      <button class="btn dark" data-act="evt" data-v="b">${L(ev.b)}</button></div>`;
  } else if (pend) {
    card = `<div class="ticket stack" style="text-align:left;gap:10px"><div class="row"><img class="px" src="${spriteURL('bolt')}" width="24" height="24" alt=""><div class="muted small caps">${T('chaos')}</div></div>
      <div style="font-size:17px;font-weight:500">${pend.text}</div>
      ${pend.extra ? `<div class="small">${pend.extra > 0 ? T('costs') + ': ' + money(-pend.extra) : T('money') + ': +' + money(-pend.extra)}</div>` : ''}
      <button class="btn dark" data-act="chaosOk">${T('okay')}</button></div>`;
  }
  return `<div class="stack" style="padding-top:12px;text-align:center">
    <div class="muted small">${L(byId(GENRES, d.genre))} · ${L(byId(THEMES, d.theme))}</div>
    <h2 style="font-size:28px;color:var(--bulb)">${esc(d.title)}</h2>
    <canvas id="set" class="px scene" width="64" height="36"></canvas>
    <div id="stage" class="pixel caps">${done ? T('premiere') : T('prod')[P.stage]}</div>
    <div class="progress"><i style="width:${P.progress}%"></i></div>
    ${card}
    ${done ? `<button class="btn primary big" data-act="release">${T('premiere')}</button>` : ''}
  </div>`;
}
function animateSet() {
  clearInterval(setTimer);
  let frame = 0;
  const tick = () => { const cv = $('#set'); if (!cv || !P) return clearInterval(setTimer); drawSet(cv, P.pending || P.progress >= 100 ? 0 : frame++, P.draft); };

  const form = () => rand(-1.8, 1.8);

  const area = [
    w.skill + form() + (w.aff.includes(d.genre) ? 1 : 0) + sk.story * .5 + (has('office') ? .5 : 0) + (has('school') ? 1 : 0),
    (ls.skill + form()) * .6 + (cs.skill + form()) * .4 + (lead.aff.includes(d.genre) ? .6 : 0) + (co.aff.includes(d.genre) ? .4 : 0) + sk.actors * .5 + (fx.act || 0) + (fx.improv ? ((ls.skill + cs.skill) / 2 + rand(-3, 3) >= 6 ? 1.2 : -1) : 0),
    b.vis + sk.visual * .5 + (has('vfx') ? 1 : 0) + (era.period && has('costume') ? .5 : 0) + (fx.vis || 0),
    b.snd + 1.5 + sk.sound * .5 + (has('sound') ? 1.5 : 0) + (fx.snd || 0),
  ].map(v => Math.max(.5, v));
  const craft = area.reduce((s, a, i) => s + a * g.focus[i] / 100, 0);
  const focusMatch = 1 - d.focus.reduce((s, f, i) => s + Math.abs(f / 10 - g.focus[i] / 100), 0) / 2;
  const gt = gtVal(d.genre, d.theme), ge = geVal(d.genre, d.era), te = teVal(d.theme, d.era);
  const fit = clamp(.55 + .15 * gt + .1 * ge + .07 * te, .05, 1);
  const recent = G.films.slice(-3);
  const repeat = recent.some(f => f.genre === d.genre && f.theme === d.theme);
  const sameGenre = recent.length && recent[recent.length - 1].genre === d.genre;
  const ratingOk = g.rat.includes(d.rating);

  let raw = craft * (.5 + .5 * focusMatch) * (.45 + .55 * fit) + 1.6 + genreLevel(d.genre) * .3
    + (fx.q || 0) + (fx.risk ? rand(-fx.risk, fx.risk * 1.15) : 0)
    - (ratingOk ? 0 : .6) - (repeat ? 1 : 0) + rand(-1.2, 1.2);
  const q = 10 * (1 - Math.exp(-Math.max(.2, raw) / 6.5));

  const tr = G.trends.real;
  const hot = tr.hot.includes(d.genre), cold = tr.cold === d.genre, hotTheme = tr.theme === d.theme;
  const fakeTrend = (G.trends.hot.includes(d.genre) && !hot) || (G.trends.theme === d.theme && !hotTheme);
  const prem = Math.random() < .55 ? PREMIERE[Math.floor(Math.random() * PREMIERE.length)] : null;
  let critic = Math.round(clamp(q * 10 + rand(-10, 10) + (fx.crit || 0) + (prem && prem.crit || 0) + (d.genre === 'documentary' ? 4 : 0), 3, 99));
  let aud = Math.round(clamp(q * 8.5 + (ls.star + cs.star) * .8 + 5 + (hot ? 4 : 0) + (hotTheme ? 3 : 0) - (cold ? 4 : 0) + rand(-12, 12), 3, 99));

  const hype = Math.max(.4, 1 + m.hype * (has('marketing') ? 1.2 : 1) + b.hype + (ls.star + cs.star * .5) / 10 + G.rep / 120
    + Math.log10(1 + G.fans) / 10 + sk.showman * .1 + (fx.hype || 0));
  const qMult = .15 + 1.35 * Math.pow(q / 10, 1.6);
  const trend = (hot ? 1.35 : 1) * (cold ? .75 : 1) * (hotTheme ? 1.15 : 1);
  const reach = byId(RATINGS, d.rating).reach * (fx.reach || 1);
  const fatigue = (repeat ? .7 : 1) * (sameGenre ? .85 : 1);
  // Wildcards: a terrible film can become a cult hit, a masterpiece can be ignored.
  let wild = null, wildMult = 1;
  if (critic < 38 && Math.random() < .1) { wild = 'cult'; wildMult = 2.6; aud = Math.max(aud, 80 + Math.floor(rand(0, 15))); }
  else if (critic > 78 && Math.random() < .1) { wild = 'ignored'; wildMult = .4; }
  const luck = rand(.7, 1.35);
  const opening = 25000 * Math.pow(m.screens, .85) * Math.pow(hype, 1.2) * qMult * g.aud * trend * reach * fatigue
    * luck * (prem && prem.mult || 1) * wildMult * (G.nextMult || 1);
  const legs = clamp(.42 + aud / 100 * .43 + rand(-.06, .06), .35, .9);
  const weeks = []; let wk = opening;
  for (let i = 0; i < 8; i++) { weeks.push(Math.round(wk * (prem && prem.strike && i < 2 ? .35 : 1))); wk *= legs * rand(.88, 1.1); }
  const gross = weeks.reduce((a, b) => a + b, 0);
  const shareRate = .55 + (has('cinemas') ? .1 : 0);
  const share = Math.round(gross * shareRate);
  const stream = has('streaming') ? Math.round(gross * .2) : 0;
  const profit = share + stream - spent;

  return { q, critic, aud, weeks, gross, share, stream, profit, repeat, sameGenre, hot, hotTheme, fakeTrend, prem, wild, luck, ratingOk };
}

function release() {
  const d = P.draft, fx = P.fx, spent = P.cost + P.extra;
  const s = simulate(d, fx, spent);
  G.nextMult = null;
  const prevYear = year();
  const film = { id: G.nextId++, title: d.title.trim(), genre: d.genre, theme: d.theme, era: d.era, rating: d.rating, budget: d.budget,
    writer: d.writer, lead: d.lead, co: d.co, critic: s.critic, aud: s.aud, gross: s.gross, profit: s.profit, cost: spent, year: prevYear, award: false };
  G.films.push(film);
  G.money += s.share + s.stream;
  G.totalGross += s.gross;

  // What happened, told as a story rather than as hints.
  const story = P.log.slice();
  if (s.prem) story.push(L(s.prem));
  if (s.wild === 'cult') story.push(T('wildCult'));
  if (s.wild === 'ignored') story.push(T('wildIgnored'));
  if (s.luck > 1.25) story.push(T('luckyWeek'));
  if (s.luck < .78) story.push(T('unluckyWeek'));
  if (s.fakeTrend) story.push(T('fakeTrend'));

  // Career
  const repDelta = Math.round(clamp((s.critic - 48) / 3 + (s.profit > 0 ? 1 : -1) + (fx.rep || 0) + (s.prem && s.prem.rep || 0), -8, 15));
  G.rep = clamp(G.rep + repDelta, 0, 100);
  const fansDelta = Math.round(s.gross / 40 * s.aud / 100);
  G.fans += fansDelta;
  const xpGain = Math.round((40 + s.critic * .8 + Math.min(80, s.gross / 60000)) * (has('school') ? 1.3 : 1));
  G.xp += xpGain;
  let leveled = 0;
  while (G.xp >= xpNeed(G.level)) { G.xp -= xpNeed(G.level); G.level++; G.points++; leveled++; }
  G.mastery[d.genre] = (G.mastery[d.genre] || 0) + 1;
  for (const id of [d.lead, d.co]) {
    const c = G.cast[id] || (G.cast[id] = { skill: 0, star: 0 });
    c.skill = Math.min(c.skill + .2, 3);
    c.star = clamp(c.star + (s.critic >= 75 ? .5 : s.critic < 35 ? -.3 : .1), -2, 4);
  }

  // Time & goals
  G.month += 4;
  const newYear = year() !== prevYear;
  if (newYear) { G.pendingAwards = runAwards(prevYear); G.trends = null; ensureTrends(); }
  const goalsDone = checkGoals();
  R = { film, s, repDelta, fansDelta, xpGain, leveled, story, goalsDone, newYear, prevYear, similar: similarFilms(film) };
  P = null; G.prod = null; screen = 'results'; save(); render(); window.scrollTo(0, 0);
  revealResults();
}
function checkGoals() {
  const done = [];
  for (const g of GOALS) if (!G.goals[g.id] && g.test(G)) { G.goals[g.id] = true; G.money += g.reward; done.push(g); }
  return done;
}
function runAwards(y) {
  const films = G.films.filter(f => f.year === y);
  const noms = films.filter(f => f.critic >= 72 || Math.random() < .08).map(f => {
    const win = Math.random() < clamp((f.critic - 55) / 45, .05, .9);
    if (win) { f.award = true; G.awards++; G.rep = clamp(G.rep + 6, 0, 100); G.fans = Math.round(G.fans * 1.15); }
    return { id: f.id, title: f.title, critic: f.critic, win };
  });
  return { year: y, noms, any: films.length > 0 };
}

function similarFilms(f) {
  const scored = REAL_FILMS.map(r => ({ r, sc: (r.genre === f.genre ? 3 : 0) + (r.theme === f.theme ? 2 : 0) + (r.era === f.era ? 1 : 0) + Math.random() * .5 }))
    .filter(x => x.sc >= 2).sort((a, b) => b.sc - a.sc);
  return scored.slice(0, 3).map(x => x.r);
}
function letterboxdURL(r) { return 'https://letterboxd.com/search/films/' + encodeURIComponent(r.en).replace(/%20/g, '+') + '/'; }
function vResults() {
  const { film: f, s } = R;
  const tier = f.critic >= 80 ? 3 : f.critic >= 60 ? 2 : f.critic >= 40 ? 1 : 0;
  R.quote = R.quote || pick(QUOTES[G.lang][tier]); R.outlet = R.outlet || pick(OUTLETS[G.lang]);
  const hide = R.revealed ? '' : 'hidden';
  return `<div class="stack" style="padding-top:8px" id="results">
    <div class="row" style="align-items:flex-end;gap:14px"><div style="width:120px;flex:none">${poster(f, !R.revealed)}</div>
      <div style="min-width:0"><div class="muted small">${T('premiere')} · ${f.year}</div><h2 style="font-size:26px">${esc(f.title)}</h2>
      <div class="muted small">${L(byId(GENRES, f.genre))} · ${L(byId(THEMES, f.theme))} · ${L(byId(ERAS, f.era))}</div></div></div>
    <div class="row"><div class="scorebox"><span>${T('critics')}</span><div class="score" id="r-critic">${R.revealed ? f.critic : '··'}</div></div>
      <div class="scorebox"><span>${T('audience')}</span><div class="score" id="r-aud">${R.revealed ? f.aud : '··'}</div></div></div>
    <div class="ticket reveal" id="r-quote" ${hide}><div style="font-size:17px;font-style:italic">«${R.quote}»</div><div class="muted small" style="margin-top:4px">— ${R.outlet}</div></div>
    <div class="card"><div class="row"><h3>${T('boxoffice')}</h3><div class="spacer"></div><b class="mono" id="r-gross">${R.revealed ? money(s.gross) : money(0)}</b></div>
      <div class="chart">${s.weeks.map((w, i) => `<div class="col"><div class="bar" style="height:0"></div><div class="lbl">${i + 1}${T('wk')}</div></div>`).join('')}</div>
      <div class="muted small" id="r-week" style="min-height:1.4em"></div></div>
    <div class="card ledger reveal" id="r-ledger" ${hide}>
      <span>${T('gross')}</span><span class="v">${money(s.gross)}</span>
      <span>${T('share')} (${Math.round((.55 + (has('cinemas') ? .1 : 0)) * 100)}%)</span><span class="v">${money(s.share)}</span>
      ${s.stream ? `<span>${T('streaming')}</span><span class="v">${money(s.stream)}</span>` : ''}
      <span>${T('costs')}</span><span class="v">${money(-f.cost)}</span>
      <span class="total">${T('profit')}</span><span class="v total ${s.profit >= 0 ? 'hi' : 'lo'}" id="r-profit">${R.revealed ? money(s.profit) : money(0)}</span>
    </div>
    ${R.story.length ? `<div class="card reveal" id="r-story" ${hide}><h3>${T('story')}</h3><ul class="discover" style="margin-top:8px">${R.story.map(x => `<li class="reveal" ${hide}>${x}</li>`).join('')}</ul></div>` : ''}
    ${R.similar && R.similar.length ? `<div class="card reveal" id="r-similar" ${hide}><h3>${T('similar')}</h3><div class="stack" style="gap:6px;margin-top:8px">${R.similar.map(r => `<a class="reallink" href="${letterboxdURL(r)}" target="_blank" rel="noopener" data-ext="1"><span>${esc(G.lang === 'ru' ? r.ru : r.en)} <span class="muted">(${r.year})</span></span><span class="muted small">Letterboxd ↗</span></a>`).join('')}</div></div>` : ''}
    <div class="card stack reveal" style="gap:6px" id="r-gains" ${hide}><h3>${T('gains')}</h3>
      <div class="bars" style="font-size:14px"><span>${T('rep')} <b class="${R.repDelta >= 0 ? 'hi' : 'lo'}">${R.repDelta >= 0 ? '+' : ''}${R.repDelta}</b></span>
      <span>${T('fans')} <b>+${count(R.fansDelta)}</b></span><span>${T('xp')} <b>+${R.xpGain}</b></span></div>
      ${R.leveled ? `<div class="trophy">${T('levelUp')} ${T('lvl')} ${G.level}</div>` : ''}
      ${R.goalsDone.map(g => `<div class="trophy">${T('goalDone')}: ${L(g)} · +${money(g.reward)}</div>`).join('')}
    </div>
  </div>`;
}
// Tycoon-style premiere: numbers tick up one after another so the outcome stays a mystery.
const sleep = ms => new Promise(r => setTimeout(r, R && R.skip ? 0 : ms));
function countUp(el, to, ms, fmt, cls, from = 0) {
  return new Promise(done => {
    if (!el) return done();
    const t0 = performance.now();
    const step = now => {
      if (!R || (el.nodeType && !document.body.contains(el))) return done();
      const k = R.skip ? 1 : Math.min(1, (now - t0) / ms);
      // ease-out with a nervous wobble near the end
      const e = 1 - Math.pow(1 - k, 3), wob = k < 1 ? Math.sin(now / 45) * (1 - k) * .08 * (to - from) : 0;
      const v = from + (to - from) * e + wob;
      el.textContent = fmt(Math.round(v));
      if (cls) el.className = el.className.replace(/\b(hi|mid|lo)\b/g, '').trim() + ' ' + cls(Math.round(v));
      if (k < 1) requestAnimationFrame(step); else { el.textContent = fmt(to); done(); }
    };
    requestAnimationFrame(step);
  });
}
const showEl = el => { if (el) { el.hidden = false; el.classList.add('pop'); } };
async function revealResults() {
  const { film: f, s } = R;
  const barBtn = $('.bottombar [data-act="closeResults"]');
  await sleep(600);
  await countUp($('#r-critic'), f.critic, 1700, v => v, scoreClass); haptic(f.critic >= 70 ? 'ok' : f.critic < 40 ? 'err' : 'light');
  await sleep(400);
  await countUp($('#r-aud'), f.aud, 1500, v => v, scoreClass); haptic('light');
  await sleep(300);
  showEl($('#r-quote'));
  await sleep(900);
  const bars = document.querySelectorAll('.chart .bar'), max = Math.max(...s.weeks), weekEl = $('#r-week'), grossEl = $('#r-gross');
  let total = 0;
  for (let i = 0; i < s.weeks.length; i++) {
    if (!R) return;
    if (bars[i]) bars[i].style.height = (s.weeks[i] / max * 100) + '%';
    if (weekEl) weekEl.textContent = `${i + 1}${T('wk')}: +${money(s.weeks[i])}`;
    const prev = total; total += s.weeks[i];
    await countUp({ set textContent(v) { if (grossEl) grossEl.textContent = v; } }, total, 550, money, null, prev);
    if (grossEl) grossEl.textContent = money(total);
    haptic('light');
    await sleep(150);
  }
  if (weekEl) weekEl.textContent = '';
  await sleep(300);
  showEl($('#r-ledger'));
  await countUp($('#r-profit'), s.profit, 1100, money); haptic(s.profit >= 0 ? 'ok' : 'err');
  await sleep(400);
  showEl($('#r-story'));
  for (const li of document.querySelectorAll('#r-story li')) { showEl(li); await sleep(650); }
  showEl($('#r-similar'));
  await sleep(300);
  showEl($('#r-gains'));
  if (R) R.revealed = true;
  if (barBtn) barBtn.textContent = T('toStudio');
}
function vAwards() {
  const a = G.pendingAwards;
  return `<div class="stack" style="padding-top:12px">
    <div class="marquee"><div class="sub">${a.year}</div><div class="row"><img class="px" src="${spriteURL('trophy')}" width="36" height="36" alt=""><div class="studio">${T('awardsTitle')}</div></div></div>
    ${a.noms.length ? a.noms.map(n => `<div class="ticket row"><div style="flex:1;min-width:0"><div class="muted small">${T('nominated')}</div>
      <div class="pixel" style="font-size:20px;text-transform:uppercase">${esc(n.title)}</div></div>
      <div style="text-align:right">${n.win ? `<img class="px" src="${spriteURL('trophy')}" width="28" height="28" alt="">` : ''}<div><b style="color:${n.win ? '#2f7a3a' : '#8a3a30'}">${n.win ? T('won') : T('lost')}</b></div></div></div>`).join('')
      : `<p class="muted">${T('noNoms')}</p>`}
    <p class="muted">${T('newYear')} ${a.year + 1}.</p>
  </div>`;
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const ext = e.target.closest('a[data-ext]');
  if (ext && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(ext.href); } catch (err) { window.open(ext.href, '_blank'); } return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (el.dataset.locked) { toast(el.dataset.why || T('locked')); haptic('warn'); return; }
  switch (act) {
    case 'lang': G.lang = G.lang === 'ru' ? 'en' : 'ru'; save(); render(); break;
    case 'setlang': G.lang = v; save(); render(); break;
    case 'begin': {
      G.director = ($('#in-dir').value || '').trim() || (G.lang === 'ru' ? 'Режиссёр' : 'Director');
      G.studio = ($('#in-studio').value || '').trim() || T('defStudio');
      G.started = true; ensureTrends(); save(); screen = 'home'; render(); haptic('ok'); break;
    }
    case 'tab': screen = v; resetArm = false; render(); window.scrollTo(0, 0); haptic('light'); break;
    case 'newFilm': startWizard(); haptic('medium'); break;
    case 'gig': G.money += 30000; G.xp += 20; G.month += 2; while (G.xp >= xpNeed(G.level)) { G.xp -= xpNeed(G.level); G.level++; G.points++; }
      ensureTrends(); save(); render(); toast(T('gigDone')); haptic('ok'); break;
    case 'genre': W.genre = v; if (!W.titleEdited) W.title = ''; render(); haptic('light'); break;
    case 'theme': W.theme = v; if (!W.titleEdited) W.title = ''; render(); haptic('light'); break;
    case 'era': W.era = v; render(); haptic('light'); break;
    case 'rating': W.rating = v; render(); haptic('light'); break;
    case 'writer': W.writer = v; render(); haptic('light'); break;
    case 'lead': W.lead = v; render(); haptic('light'); break;
    case 'co': W.co = v; render(); haptic('light'); break;
    case 'budget': W.budget = v; render(); haptic('light'); break;
    case 'mkt': W.mkt = v; render(); haptic('light'); break;
    case 'fplus': { const i = +v, used = W.focus.reduce((a, b) => a + b, 0); if (used < 10 && W.focus[i] < 10) { W.focus[i]++; render(); haptic('light'); } break; }
    case 'fminus': { const i = +v; if (W.focus[i] > 0) { W.focus[i]--; render(); haptic('light'); } break; }
    case 'reroll': W.title = genTitle(W.genre, W.theme); W.titleEdited = false; render(); haptic('light'); break;
    case 'wnext': if (stepValid(W.step)) { W.step++; if (W.step === 5 && !W.title) W.title = genTitle(W.genre, W.theme); render(); window.scrollTo(0, 0); haptic('light'); } break;
    case 'wback': wizardBack(); break;
    case 'shoot': startProduction(); break;
    case 'evt': chooseEvent(v); break;
    case 'chaosOk': closeChaos(); break;
    case 'dismissNews': G.news = null; save(); render(); break;
    case 'release': release(); break;
    case 'closeResults': if (R && !R.revealed) { R.skip = true; break; } screen = G.pendingAwards && G.pendingAwards.any ? 'awards' : 'home'; if (screen === 'home') { G.pendingAwards = null; rollWorldEvent(); } R = null; save(); render(); window.scrollTo(0, 0); break;
    case 'closeAwards': G.pendingAwards = null; rollWorldEvent(); screen = 'home'; save(); render(); window.scrollTo(0, 0); break;
    case 'buy': { const u = byId(UPGRADES, v); if (!has(v) && unlocked(u.req) && G.money >= u.cost) { G.money -= u.cost; G.upgrades[v] = true; checkGoals(); save(); render(); toast(`${T('unlockedNew')}: ${L(u)}`); haptic('ok'); } break; }
    case 'skill': if (G.points > 0 && G.skills[v] < SKILL_MAX) { G.skills[v]++; G.points--; save(); render(); haptic('medium'); } break;
    case 'reset': if (!resetArm) { resetArm = true; render(); } else { const lang = G.lang; G = newGame(lang); resetArm = false; screen = 'onboard'; save(); render(); } break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'in-title' && W) {
    W.title = e.target.value; W.titleEdited = true;
    const tk = document.querySelector('.ticket div'); if (tk) tk.textContent = W.title || '…';
    const btn = document.querySelector('[data-act="shoot"]'); if (btn) btn.disabled = !stepValid(W.step);
  }
});
function wizardBack() {
  if (!W) return;
  if (W.step === 0) { W = null; screen = 'home'; } else W.step--;
  render(); window.scrollTo(0, 0); haptic('light');
}
if (inTG && TG.BackButton) { try { TG.BackButton.onClick(wizardBack); } catch (e) {} }

// Resume a production that was interrupted (the app was closed mid-shoot).
function boot() {
  if (G.prod && !G.prod.events) { G.money += G.prod.cost; G.prod = null; save(); }
  if (G.trends && !G.trends.real) G.trends = null;
  if (G.prod) { P = G.prod; screen = 'production'; }
  render();
  if (P && screen === 'production') tickProduction();
}
boot();
loadCloud(() => { if (screen !== 'production') boot(); });
})();
</script>
